[project]
name = "sign402-gateway"
version = "0.1.0"
description = "Unified local gateway for Hermes Sign402 Firefly approvals and Algorand payment execution"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=42.0.0",
  "eth-account>=0.13.0",
  "mcp>=1.27,<2",
  "pyserial>=3.5",
  "spending-memory @ git+https://github.com/bubon-ik/spending-memory@9cef92f6ad350e187cff80b99b27d2954a6d61c2",
  "toons>=0.7,<1",
]

[project.scripts]
sign402-gateway = "sign402_gateway.server:main"
