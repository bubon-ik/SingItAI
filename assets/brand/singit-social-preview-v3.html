<!DOCTYPE html>
<!-- Source of website/assets/singit-social-preview-v3.png (1200x630, og:image). To re-render:
     Chrome --headless=new --hide-scrollbars --force-device-scale-factor=1 --window-size=1200,630
            --virtual-time-budget=5000 --screenshot=out.png file:///path/to/this.html -->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SingIt social preview</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400&family=Geist+Mono:wght@400&display=block" rel="stylesheet">
<style>
  :root {
    --ink: #0c0a08; --paper: #ffffff; --bone: #f4f2f0; --ash: #6d6c6b; --hairline: #e5e7eb;
    --accent: #3ecf8e; --brand-ink: #0a7a4b;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: var(--bone); color: var(--ink);
    font-family: "Inter", system-ui, sans-serif; font-weight: 400; font-feature-settings: "ss01";
    -webkit-font-smoothing: antialiased;
    display: grid; grid-template-columns: 1fr 380px; gap: 56px; align-items: center;
    padding: 72px 80px;
  }
  .brand { display: flex; align-items: center; gap: 12px; font-size: 30px; letter-spacing: -0.02em; margin-bottom: 44px; }
  .brand svg { width: 44px; height: 44px; color: var(--brand-ink); }
  h1 { font-weight: 400; font-size: 66px; line-height: 1.02; letter-spacing: -0.03em; }
  h1 em { font-style: normal; color: var(--ash); display: block; }
  .url { margin-top: 40px; font-size: 22px; color: var(--ash); }

  .card { background: var(--paper); border: 1px solid var(--hairline); border-radius: 16px; padding: 28px; }
  .head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
  .head strong { font-weight: 400; font-size: 20px; }
  .head span { display: block; font-size: 15px; color: var(--ash); margin-top: 2px; }
  .state { font-size: 13px; letter-spacing: 0.05em; text-transform: uppercase; background: var(--bone);
    border-radius: 6px; padding: 5px 9px; }
  .label { font-size: 13px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ash); }
  .big { font-size: 52px; line-height: 1.05; letter-spacing: -0.02em; margin: 8px 0 4px; }
  .of { font-size: 16px; color: var(--ash); margin-bottom: 16px; }
  .bar { height: 7px; border-radius: 4px; background: var(--bone); overflow: hidden; margin-bottom: 22px; }
  .bar i { display: block; height: 100%; width: 75%; background: var(--accent); }
  .row { display: flex; justify-content: space-between; padding: 12px 0; border-top: 1px solid var(--hairline); font-size: 16px; }
  .row span:first-child { color: var(--ash); }
</style>
</head>
<body>
  <div>
    <div class="brand">
      <svg viewBox="0 0 240 240" fill="none" aria-hidden="true">
        <path d="M192 108 V152 Q192 176 168 176 H112 Q88 176 88 152 V88 Q88 64 112 64 H168 Q192 64 192 78"
              stroke="currentColor" stroke-width="12.5" stroke-linecap="round"/>
        <path d="M116 118 L139 143 L188 86 H206" stroke="currentColor" stroke-width="11.5"
              stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="216" cy="86" r="8" stroke="currentColor" stroke-width="8.5"/>
        <g stroke="currentColor" stroke-width="9" stroke-linecap="round">
          <line x1="58" y1="94" x2="88" y2="94"/><line x1="58" y1="121" x2="88" y2="121"/><line x1="58" y1="148" x2="88" y2="148"/>
        </g>
        <g fill="currentColor"><circle cx="49" cy="94" r="9"/><circle cx="49" cy="121" r="9"/><circle cx="49" cy="148" r="9"/></g>
      </svg>
      SingIt
    </div>
    <h1>Your agent spends. <em>Your wallet keeps the money.</em></h1>
    <p class="url">singitai.app</p>
  </div>
  <div class="card">
    <div class="head">
      <div><strong>Your allowance</strong><span>Base · USDC</span></div>
      <span class="state">Active</span>
    </div>
    <div class="label">Can spend today</div>
    <div class="big">$14.99</div>
    <div class="of">of the $20.00 daily limit</div>
    <div class="bar"><i></i></div>
    <div class="row"><span>Per purchase</span><span>up to $5.00</span></div>
    <div class="row"><span>Where the money is</span><span>your wallet</span></div>
  </div>
</body>
</html>
